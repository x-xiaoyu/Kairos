name: Kairos
options:
  bundleIdPrefix: com.xiaoyu.kairos
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
targets:
  Kairos:
    type: application
    platform: iOS
    sources: [Kairos]
    info:
      path: Kairos/Info.plist
      properties:
        CFBundleDisplayName: Kairos
        LSApplicationCategoryType: public.app-category.productivity
        NSCalendarsFullAccessUsageDescription: Kairos saves completed focus sessions to your Apple Calendar when you enable this setting.
        NSLocationWhenInUseUsageDescription: Kairos uses your approximate location to show current local weather.
        NSLocalNetworkUsageDescription: Kairos connects to your local Agent service during development.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoyu.kairos
        PRODUCT_NAME: Kairos
    scheme:
      testTargets: [KairosTests]
  KairosTests:
    type: bundle.unit-test
    platform: iOS
    sources: [KairosTests]
    dependencies:
      - target: Kairos
